<article
  class="tarjeta-producto"
  data-id="{{id}}">
  <a
    href="/producto/{{id}}"
    class="tarjeta-producto__enlace">
    <figure class="tarjeta-producto__contenedor-imagen">
      <img
        src="{{imagen}}"
        alt="{{nombre}}"
        class="tarjeta-producto__imagen"
        loading="lazy" />
    </figure>
    <div class="tarjeta-producto__contenido">
      <h3 class="tarjeta-producto__nombre">{{nombre}}</h3>
      <div class="tarjeta-producto__precios">
        <span class="tarjeta-producto__precio">Bs. {{precio}}</span>
        <span class="tarjeta-producto__cuotas">12 cuotas de Bs. {{cuota}}</span>
      </div>
    </div>
  </a>
  <button class="tarjeta-producto__boton">Agregar al carrito</button>
</article>
