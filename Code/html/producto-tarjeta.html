<article class="tarjeta-producto" onclick="location.href='/producto/{{id}}'">
    <div class="tarjeta-producto__contenedor-imagen">
        <img src="{{image}}" alt="{{name}}" class="tarjeta-producto__imagen">
    </div>
    <div class="tarjeta-producto__informacion">
        <p class="tarjeta-producto__marca">{{brand}}</p>
        <h3 class="tarjeta-producto__nombre">{{name}}</h3>
        <div class="tarjeta-producto__detalles-precio">
            <span class="tarjeta-producto__precio">Bs. {{price}}</span>
            <span class="tarjeta-producto__cuotas">6 cuotas de Bs {{cuota}}</span>
        </div>
        <button class="tarjeta-producto__boton btn-agregar" 
                data-id="{{id}}" 
                data-nombre="{{name}}" 
                data-precio="{{price}}" 
                data-imagen="{{image}}">
            Agregar
        </button>
    </div>
</article>
