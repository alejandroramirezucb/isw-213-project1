﻿<article class="product-card" onclick="location.href='/product/{{id}}'">
    <div class="product-card__image-container">
        <img src="{{image}}" alt="{{name}}" class="product-card__image">
    </div>
    <div class="product-card__info">
        <p class="product-card__brand">{{brand}}</p>
        <h3 class="product-card__name">{{name}}</h3>
        <div class="product-card__price-details">
            <span class="product-card__price">Bs. {{price}}</span>
            <span class="product-card__installments">6 cuotas de Bs {{cuota}}</span>
        </div>
        <button class="product-card__button">Agregar</button>
    </div>
</article>
