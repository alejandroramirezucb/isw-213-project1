<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Raidencenter</title>
    <link rel="icon" href="/assets/icon.png" type="image/png">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/carrito.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header id="navbar-placeholder"></header>
    
    <main class="contenedor-carrito">
        <div class="carrito-grid">
            <section class="carrito-productos">
                <h1>Mi Carrito</h1>
                <div id="lista-carrito" class="lista-carrito">
                    <p>Cargando carrito...</p>
                </div>
            </section>

            <section class="carrito-checkout">
                <div class="resumen-checkout">
                    <h2>Resumen de Compra</h2>
                    <div id="resumen-detalle" class="resumen-detalle">
                    </div>

                    <div class="checkout-seccion">
                        <h3>Método de Entrega</h3>
                        <div class="opciones-entrega">
                            <label class="opcion-radio">
                                <input type="radio" name="metodo-entrega" value="recojo_almacen" checked>
                                <span class="radio-label">Recoger en Almacén</span>
                            </label>
                            <label class="opcion-radio">
                                <input type="radio" name="metodo-entrega" value="delivery">
                                <span class="radio-label">Envío por Delivery</span>
                            </label>
                        </div>
                        <div id="campo-direccion" class="campo-adicional" style="display: none;">
                            <label for="direccion">Dirección de Entrega:</label>
                            <textarea id="direccion" placeholder="Ej. Av. Siempre Viva 123..."></textarea>
                        </div>
                    </div>

                    <div class="checkout-seccion">
                        <h3>Método de Pago</h3>
                        <div class="opciones-pago">
                            <label class="opcion-radio">
                                <input type="radio" name="metodo-pago" value="efectivo" checked>
                                <span class="radio-label">Efectivo</span>
                            </label>
                            <label class="opcion-radio">
                                <input type="radio" name="metodo-pago" value="tarjeta">
                                <span class="radio-label">Tarjeta</span>
                            </label>
                            <label class="opcion-radio">
                                <input type="radio" name="metodo-pago" value="qr">
                                <span class="radio-label">QR</span>
                            </label>
                        </div>
                    </div>

                    <div class="total-final">
                        <span>Total a pagar:</span>
                        <span id="total-precio">Bs. 0.00</span>
                    </div>

                    <button id="btn-finalizar" class="btn-finalizar">Finalizar Pago</button>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/utilidades/CalculadorPrecio.js"></script>
    <script src="/js/servicios/ProductoServicio.js"></script>
    <script src="/js/servicios/CarritoServicio.js"></script>
    <script src="/js/utilidades/ActualizadorContador.js"></script>
    <script src="/js/carrito.js"></script>
    <script>
        fetch('/api/navbar')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar-placeholder').innerHTML = html;
                const actualizadorContador = new ActualizadorContador(new CarritoServicio());
                actualizadorContador.actualizar();

                const enlaces = document.querySelectorAll('.barra-navegacion__dropdown-link');
                enlaces.forEach(enlace => {
                    enlace.addEventListener('click', (e) => {
                        e.preventDefault();
                        const href = enlace.getAttribute('href') || '';
                        const query = href.includes('?') ? href.split('?')[1] : (new URL(enlace.href)).searchParams.toString();
                        const params = new URLSearchParams(query);
                        const categoria = params.get('categoria');
                        if (categoria) window.location.href = '/' + '?categoria=' + encodeURIComponent(categoria);
                    });
                });
            });
    </script>
</body>
</html>
