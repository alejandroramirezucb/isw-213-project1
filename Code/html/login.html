<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Raidencenter</title>
    <link
      rel="icon"
      href="/assets/icon.png"
      type="image/png" />
    <link
      rel="stylesheet"
      href="/css/navbar.css" />
    <link
      rel="stylesheet"
      href="/css/styles.css" />
    <style>
      .contenedor-login {
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .contenedor-login h1 {
        margin-bottom: 25px;
        color: #034e8b;
      }
      .form-grupo {
        margin-bottom: 15px;
        text-align: left;
      }
      .form-grupo label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        color: #666;
      }
      .form-grupo input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .btn-login {
        display: block;
        width: auto;
        min-width: 220px;
        max-width: 320px;
        margin: 10px auto 0;
        padding: 12px 28px;
        background: #034e8b;
        color: white;
        border: none;
        border-radius: 24px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
        text-align: center;
      }
      .oauth-seccion {
        margin-top: 25px;
        border-top: 1px solid #eee;
        padding-top: 20px;
      }
      .btn-oauth {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 25px;
        background: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 14px;
      }
      .btn-oauth img {
        width: 20px;
      }
      .cambiar-modo {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }
      .cambiar-modo a {
        color: #034e8b;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header id="navbar-placeholder"></header>

    <main class="contenedor-login">
      <div id="login-view">
        <h1>Iniciar Sesión</h1>
        <form id="form-login">
          <div class="form-grupo">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              required />
          </div>
          <div class="form-grupo">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              required />
          </div>
          <button
            type="submit"
            class="btn-login">
            Ingresar
          </button>
        </form>
        <div class="cambiar-modo">
          ¿No tienes cuenta?
          <a
            href="/register"
            id="ir-a-registro"
            >Regístrate aquí</a
          >
        </div>
      </div>

      <div
        id="registro-view"
        style="display: none">
        <h1>Crear Cuenta</h1>
        <form id="form-registro">
          <div class="form-grupo">
            <label for="reg-nombre">Nombre Completo</label>
            <input
              type="text"
              id="reg-nombre"
              required />
          </div>
          <div class="form-grupo">
            <label for="reg-email">Correo Electrónico</label>
            <input
              type="email"
              id="reg-email"
              required />
          </div>
          <div class="form-grupo">
            <label for="reg-password">Contraseña</label>
            <input
              type="password"
              id="reg-password"
              required
              minlength="6" />
          </div>
          <div class="form-grupo">
            <label for="reg-telefono-local">Teléfono (Bolivia)</label>
            <div style="display: flex; align-items: center; gap: 5px">
              <span
                style="
                  padding: 10px;
                  background: #eee;
                  border-radius: 8px;
                  font-size: 14px;
                "
                >+591</span
              >
              <input
                type="tel"
                id="reg-telefono-local"
                placeholder="71234567"
                maxlength="8" />
            </div>
          </div>
          <div class="form-grupo">
            <label for="reg-rol">Tipo de cuenta</label>
            <select
              id="reg-rol"
              class="combobox"
              required>
              <option value="cliente">Cliente</option>
              <option value="chofer">Chofer</option>
            </select>
          </div>
          <button
            type="submit"
            class="btn-login btn-primary">
            Registrarse
          </button>
        </form>
        <div class="cambiar-modo">
          ¿Ya tienes cuenta?
          <a
            href="/login"
            id="ir-a-login"
            >Inicia sesión</a
          >
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/utilidades/Toaster.js"></script>
    <script src="/js/navbar-comun.js"></script>
    <script src="/js/navbar-global.js"></script>
    <script src="/js/servicios/CarritoServicio.js"></script>
    <script src="/js/utilidades/ActualizadorContador.js"></script>
    <script src="/js/auth.js"></script>
    <script>
      fetch('/api/navbar')
        .then((res) => res.text())
        .then((html) => {
          document.getElementById('navbar-placeholder').innerHTML = html;
          actualizarIconoUsuario();
          const actualizador = new ActualizadorContador(new CarritoServicio());
          actualizador.actualizar();
        });
    </script>
  </body>
</html>
