<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Raidencenter - Tienda de Tecnología</title>
    <link
      rel="stylesheet"
      href="/css/styles.css" />
    <link
      rel="stylesheet"
      href="/css/navbar.css" />
    <link
      rel="stylesheet"
      href="/css/filtros.css" />
    <link
      rel="stylesheet"
      href="/css/producto-tarjeta.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  </head>
  <body>
    <header id="navbar-container"></header>

    <aside class="panel-filtros">
      <div class="panel-filtros__contenedor">
        <div class="panel-filtros__grupo">
          <label
            class="panel-filtros__etiqueta"
            for="precioMinimo"
            >Precio mínimo</label
          >
          <input
            type="number"
            id="precioMinimo"
            class="panel-filtros__campo-numero"
            placeholder="Mín"
            min="0" />
        </div>

        <div class="panel-filtros__grupo">
          <label
            class="panel-filtros__etiqueta"
            for="precioMaximo"
            >Precio máximo</label
          >
          <input
            type="number"
            id="precioMaximo"
            class="panel-filtros__campo-numero"
            placeholder="Máx"
            min="0" />
        </div>

        <div class="panel-filtros__grupo">
          <label class="panel-filtros__checkbox">
            <input
              type="checkbox"
              id="soloDisponibles" />
            Solo disponibles
          </label>
        </div>

        <div class="panel-filtros__acciones">
          <button class="boton-primario">Aplicar</button>
          <button class="boton-secundario">Limpiar</button>
        </div>
      </div>
    </aside>

    <main class="contenedor-principal">
      <section class="contenedor-productos">
        <div class="productos-grid"></div>
      </section>
    </main>

    <script src="/js/utilidades/ClienteSupabase.js"></script>
    <script src="/js/utilidades/Toaster.js"></script>
    <script src="/js/utilidades/CalculadorPrecio.js"></script>
    <script src="/js/utilidades/ActualizadorContador.js"></script>
    <script src="/js/servicios/CarritoServicio.js"></script>
    <script src="/js/servicios/ProductoServicio.js"></script>
    <script src="/js/controladores/ControladorProductos.js"></script>
    <script src="/js/controladores/ControladorFiltros.js"></script>
    <script src="/js/navbar-comun.js"></script>
    <script src="/js/navbar-global.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
