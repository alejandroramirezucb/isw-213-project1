<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Detalle del Producto - Raidencenter</title>
    <link
      rel="stylesheet"
      href="/css/styles.css" />
    <link
      rel="stylesheet"
      href="/css/navbar.css" />
    <link
      rel="stylesheet"
      href="/css/producto-detalle.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  </head>
  <body>
    <header id="navbar-container"></header>

    <main class="detalle-contenedor">
      <section class="detalle__imagen">
        <img
          class="detalle__imagen-foto"
          src=""
          alt="Producto" />
        <div class="detalle__galeria-miniaturas"></div>
      </section>

      <section class="detalle__info">
        <h1 class="detalle__nombre"></h1>
        <div class="detalle__precio-contenedor">
          <p class="detalle__precio"></p>
          <p class="detalle__cuotas"></p>
        </div>
        <p class="detalle__stock"></p>
        <div class="detalle__descripcion-contenedor">
          <p class="detalle__descripcion-texto"></p>
        </div>
        <div class="detalle__cantidad-selector">
          <label class="detalle__cantidad-etiqueta">Cantidad</label>
          <div class="detalle__cantidad-controles">
            <button
              class="detalle__cantidad-boton detalle__cantidad-boton--menos"
              aria-label="Reducir cantidad">
              −
            </button>
            <input
              type="number"
              class="detalle__cantidad-input"
              value="1"
              min="1"
              readonly />
            <button
              class="detalle__cantidad-boton detalle__cantidad-boton--mas"
              aria-label="Aumentar cantidad">
              +
            </button>
          </div>
        </div>
        <button class="detalle__boton-agregar">Agregar al carrito</button>
      </section>
    </main>

    <script src="/js/utilidades/ClienteSupabase.js"></script>
    <script src="/js/utilidades/Toaster.js"></script>
    <script src="/js/utilidades/CalculadorPrecio.js"></script>
    <script src="/js/utilidades/ActualizadorContador.js"></script>
    <script src="/js/servicios/CarritoServicio.js"></script>
    <script src="/js/servicios/ProductoServicio.js"></script>
    <script src="/js/navbar-comun.js"></script>
    <script src="/js/navbar-global.js"></script>
    <script src="/js/producto-detalle.js"></script>
  </body>
</html>
