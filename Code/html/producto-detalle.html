<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Detalle del Producto - Raidencenter</title>
    <link
      rel="icon"
      href="/assets/icon.png"
      type="image/png" />
    <link
      rel="stylesheet"
      href="/css/navbar.css" />
    <link
      rel="stylesheet"
      href="/css/producto-detalle.css" />
    <link
      rel="stylesheet"
      href="/css/producto-detalle-extras.css" />
    <link
      rel="stylesheet"
      href="/css/filtros.css" />
    <link
      rel="stylesheet"
      href="/css/styles.css" />
  </head>
  <body>
    <header id="navbar-placeholder"></header>
    <main
      class="detalle-contenedor"
      id="detalle-producto">
      <div class="cargando">Cargando producto...</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/utilidades/Toaster.js"></script>
    <script src="/js/navbar-comun.js"></script>
    <script src="/js/navbar-global.js"></script>
    <script src="/js/utilidades/CalculadorPrecio.js"></script>
    <script src="/js/servicios/ProductoServicio.js"></script>
    <script src="/js/servicios/CarritoServicio.js"></script>
    <script src="/js/utilidades/ActualizadorContador.js"></script>
    <script src="/js/producto-detalle.js"></script>
    <script>
      fetch('/api/navbar')
        .then((res) => res.text())
        .then((html) => {
          document.getElementById('navbar-placeholder').innerHTML = html;
          actualizarIconoUsuario();
          const actualizadorContador = new ActualizadorContador(
            new CarritoServicio(),
          );
          actualizadorContador.actualizar();
          inicializarDropdownCategorias();

          const aplicarFiltrosDesdePagina = () => {
            const precioMin = document.getElementById(
              'filtro-precio-minimo',
            )?.value;
            const precioMax = document.getElementById(
              'filtro-precio-maximo',
            )?.value;
            const soloDisp = document.getElementById(
              'filtro-solo-disponibles',
            )?.checked;
            const params = new URLSearchParams();
            if (precioMin) params.set('precioMinimo', precioMin);
            if (precioMax) params.set('precioMaximo', precioMax);
            if (soloDisp) params.set('soloDisponibles', 'true');
            if (params.toString())
              window.location.href = '/?' + params.toString() + '&filtros=show';
          };

          document
            .getElementById('btn-aplicar-filtros')
            ?.addEventListener('click', aplicarFiltrosDesdePagina);
        });
    </script>
  </body>
</html>
