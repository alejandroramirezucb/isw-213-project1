<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Historial de Pedidos - Raidencenter</title>
    <link
      rel="stylesheet"
      href="/css/styles.css" />
    <link
      rel="stylesheet"
      href="/css/navbar.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
      .pagina-historial {
        max-width: 800px;
        margin: 6rem auto 2rem;
        padding: 0 1.5rem;
      }
      .pagina-historial__titulo {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        color: #1a1a2e;
      }
      .historial__lista {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .historial__mensaje-vacio {
        text-align: center;
        color: #888;
        font-size: 1.1rem;
        padding: 3rem 0;
      }
      .historial__pedido {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      .historial__pedido-cabecera {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
      }
      .historial__pedido-numero {
        font-size: 1.1rem;
        color: #1a1a2e;
        margin: 0 0 0.3rem 0;
      }
      .historial__pedido-fecha {
        font-size: 0.85rem;
        color: #888;
      }
      .historial__estado {
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        text-transform: capitalize;
      }
      .historial__estado--pendiente {
        background: #fff3cd;
        color: #856404;
      }
      .historial__estado--confirmado {
        background: #d1ecf1;
        color: #0c5460;
      }
      .historial__estado--enviado {
        background: #cce5ff;
        color: #004085;
      }
      .historial__estado--entregado {
        background: #d4edda;
        color: #155724;
      }
      .historial__estado--cancelado {
        background: #f8d7da;
        color: #721c24;
      }
      .historial__estado--recibido {
        background: #e8f0fe;
        color: #1a56a0;
      }
      .historial__pedido-detalles {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.9rem;
        color: #555;
      }
      .historial__pedido-total {
        font-weight: 600;
        color: #034e8b;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <header id="navbar-container"></header>

    <main class="pagina-historial">
      <h1 class="pagina-historial__titulo">Historial de Pedidos</h1>
      <div class="historial__lista"></div>
    </main>

    <script src="/js/utilidades/ClienteSupabase.js"></script>
    <script src="/js/utilidades/Toaster.js"></script>
    <script src="/js/utilidades/ActualizadorContador.js"></script>
    <script src="/js/servicios/CarritoServicio.js"></script>
    <script src="/js/navbar-comun.js"></script>
    <script src="/js/navbar-global.js"></script>
    <script src="/js/historial.js"></script>
  </body>
</html>
