services:
  - type: web
    name: raidencenter
    runtime: docker
    dockerfilePath: ./Code/Dockerfile
    dockerContext: ./Code
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
